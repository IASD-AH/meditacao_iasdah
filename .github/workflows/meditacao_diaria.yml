name: Publicar Meditação Diária no Telegram e WhatsApp

on:
  schedule:
    - cron: '13 0 * * *'

  workflow_dispatch:
    inputs:
      pareamento:
        description: 'Gerar QR e atualizar sessão sem publicar'
        type: boolean
        required: false
        default: false

permissions:
  actions: read
  contents: read

concurrency:
  group: meditacao-diaria
  cancel-in-progress: false

jobs:
  build-and-send:

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:

      ############################################################
      # CHECKOUT
      ############################################################

      - name: Checkout
        uses: actions/checkout@v4

      - name: Mostrar hora do runner
        run: date -u

      ############################################################
      # AMBIENTE
      ############################################################

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar locale pt_PT
        run: |
          sudo apt-get update
          sudo apt-get install -y language-pack-pt
          sudo locale-gen pt_PT.UTF-8
          sudo update-locale LANG=pt_PT.UTF-8

      ############################################################
      # RESTAURAR SESSÃO
      ############################################################
      # Descarrega o artefacto whatsapp-session MAIS RECENTE e não expirado,
      # independentemente do resultado do run que o criou. Antes só se
      # aceitavam runs "success": uma sessão renovada num run que depois
      # falhou no envio nunca era reutilizada e o bot ficava preso a um
      # snapshot cada vez mais antigo.
      # Repositório PÚBLICO: qualquer utilizador GitHub pode descarregar
      # artefactos. A sessão (= acesso total à conta WhatsApp) é por isso
      # cifrada com AES-256 usando o secret WHATSAPP_SESSION_KEY.
      - name: Restaurar sessão WhatsApp
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WHATSAPP_SESSION_KEY: ${{ secrets.WHATSAPP_SESSION_KEY }}
        run: |
          ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=whatsapp-session&per_page=30" \
                 --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].id // empty')
          if [ -z "$ID" ]; then
            echo "::warning::Nenhum artefacto whatsapp-session disponível — será necessário pareamento."
            exit 0
          fi
          echo "A descarregar artefacto $ID"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ID}/zip" > session.zip
          unzip -o -q session.zip
          rm -f session.zip
          if [ -f whatsapp-session.tar.gz.enc ]; then
            if [ -z "$WHATSAPP_SESSION_KEY" ]; then
              echo "::error::Sessão cifrada mas o secret WHATSAPP_SESSION_KEY não está definido."
              exit 1
            fi
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
              -in whatsapp-session.tar.gz.enc -out whatsapp-session.tar.gz \
              -pass env:WHATSAPP_SESSION_KEY
            rm -f whatsapp-session.tar.gz.enc
          fi
          ls -lh whatsapp-session*.tar.gz

      - name: Extrair e validar sessão
        run: |
          python session_manager.py restore --forcar || \
            python session_manager.py recuperar --forcar || true
          # Locks de um Chromium antigo impedem o arranque ("browser is already running").
          rm -f whatsapp_auth/session/Singleton* || true
          # Nunca herdar o marker de sessão fresca de outra execução.
          rm -f .session_fresh
          du -sh whatsapp_auth 2>/dev/null || echo "whatsapp_auth inexistente"

      ############################################################
      # DEPENDÊNCIAS
      ############################################################

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests==2.32.5 beautifulsoup4==4.14.2 urllib3==2.5.0 pillow==12.3.0

          # Versões fixadas em package.json/package-lock.json
          # (whatsapp-web.js 1.34.8 + fix upstream #201990 "Socket", commit 38eb45b:
          # o WA Web >= 2.3000.1055xxx já não tem WAWebSocketModel em /login/;
          # 1.34.8 corrige "getChat" undefined, id._serialized
          # e a re-injeção da SPA que causava "Execution context was destroyed").
          npm ci --no-audit --no-fund

      ############################################################
      # TELEGRAM
      ############################################################

      - name: Publicar Telegram
        if: ${{ !inputs.pareamento }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Alertas de falha (scraping/envio) vão para o chat pessoal via bot.
          TELEGRAM_PERSONAL_CHAT_ID: ${{ secrets.TELEGRAM_PERSONAL_CHAT_ID }}
        run: python meditacao_iasdah.py

      # Fase de teste do versículo diário: até ao lançamento
      # (VERSICULOS_DATA_INICIO, por omissão 2027-01-01) envia o versículo do
      # dia só para o chat pessoal do administrador. Depois do lançamento não
      # faz nada (o versículo passa a sair às 14:00 no seu workflow). Nunca
      # falha o job nem toca no payload do WhatsApp das meditações.
      - name: Versículo diário (teste no chat do administrador)
        if: ${{ !inputs.pareamento }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_PERSONAL_CHAT_ID: ${{ secrets.TELEGRAM_PERSONAL_CHAT_ID }}
          VERSICULOS_DATA_INICIO: ${{ vars.VERSICULOS_DATA_INICIO }}
        run: python versiculo_diario.py --admin-teste

      ############################################################
      # WHATSAPP
      ############################################################

      - name: Enviar WhatsApp
        id: whatsapp
        env:
          WHATSAPP_GROUP_ID: ${{ secrets.WHATSAPP_GROUP_ID }}
          WHATSAPP_PAREAMENTO: ${{ inputs.pareamento && '1' || '0' }}
          # Opcional: fixar a versão do WhatsApp Web (variável do repositório).
          WHATSAPP_WEB_VERSION: ${{ vars.WHATSAPP_WEB_VERSION }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # QR só para o chat pessoal do administrador, nunca para o canal.
          TELEGRAM_PERSONAL_CHAT_ID: ${{ secrets.TELEGRAM_PERSONAL_CHAT_ID }}
        run: node send_whatsapp.js

      ############################################################
      # ALERTA DE FALHA
      ############################################################

      - name: Alerta de falha
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_PERSONAL_CHAT_ID: ${{ secrets.TELEGRAM_PERSONAL_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SESSAO_FRESCA: ${{ hashFiles('.session_fresh') != '' && '1' || '0' }}
        run: python alert_failure.py

      ############################################################
      # GUARDAR SESSÃO
      ############################################################
      # Guarda sempre que ESTA execução autenticou (.session_fresh, escrito
      # no evento 'ready' e fora do tarball) — mesmo que o envio tenha
      # falhado. Assim o artefacto é renovado a cada login bem-sucedido e a
      # retenção de 90 dias conta a partir do último login, não do último
      # envio perfeito. Uma sessão revogada apaga o marker e nunca é guardada.

      - name: Limpar caches da sessão
        if: ${{ always() && hashFiles('.session_fresh') != '' }}
        run: python session_manager.py clean

      - name: Compactar e cifrar sessão
        if: ${{ always() && hashFiles('.session_fresh') != '' }}
        env:
          WHATSAPP_SESSION_KEY: ${{ secrets.WHATSAPP_SESSION_KEY }}
        run: |
          python session_manager.py compress
          if [ -n "$WHATSAPP_SESSION_KEY" ]; then
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
              -in whatsapp-session.tar.gz -out whatsapp-session.tar.gz.enc \
              -pass env:WHATSAPP_SESSION_KEY
            rm -f whatsapp-session.tar.gz
          else
            echo "::warning::WHATSAPP_SESSION_KEY não definido: sessão guardada SEM cifra num repositório público."
          fi
          ls -lh whatsapp-session.tar.gz*

      - name: Guardar sessão WhatsApp
        uses: actions/upload-artifact@v4
        if: ${{ always() && hashFiles('.session_fresh') != '' }}
        with:
          name: whatsapp-session
          path: whatsapp-session.tar.gz*
          retention-days: 90
          overwrite: true
          if-no-files-found: error
